# Сборка APK в облаке: на раннере GitHub уже стоят JDK и Android SDK,
# поэтому локально ставить 3 ГБ инструментов не нужно.
# Готовый файл появляется во вкладке Actions → нужный запуск → Artifacts.
name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:        # кнопка «Run workflow» — собрать вручную

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Тесты движка
        run: |
          node tests/stats.test.mjs
          node tests/import.test.mjs
          node tests/engine.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить зависимости Capacitor
        run: npm install --no-audit --no-fund

      - name: Положить веб-приложение внутрь APK
        run: npx cap sync android

      # Проект собирается под compileSdk 36. На раннере обычно есть более старые
      # платформы, поэтому доустанавливаем нужную — иначе Gradle падает
      # с «Failed to find target with hash string android-36».
      - name: Доустановить платформу Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: yasnaya-golova-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
