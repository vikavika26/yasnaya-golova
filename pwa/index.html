<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1216">
  <title>Ясная голова</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <h1 id="screen-title">Сегодня</h1>
  <button id="btn-settings" class="icon-btn" aria-label="Настройки">⚙</button>
</header>

<main id="view" aria-live="polite">
  <div class="loading">Открываю дневник…</div>
</main>

<nav class="tabs" role="tablist">
  <button class="tab active" data-screen="today" role="tab">Сегодня</button>
  <button class="tab" data-screen="triggers" role="tab">Триггеры</button>
  <button class="tab" data-screen="diary" role="tab">Дневник</button>
  <button class="tab" data-screen="doctor" role="tab">Врачу</button>
</nav>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
